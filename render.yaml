services:
  # SkillMap AI - Backend Python / FastAPI Engine
  - type: web
    name: skillmap-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: "python -m pip install -r requirements.txt"
    startCommand: "python -m uvicorn main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: DATABASE_URL
        sync: false

  # SkillMap AI - Frontend React + Vite + Three.js
  - type: web
    name: skillmap-frontend
    env: static
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: "./dist"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
