services:
  - type: web
    name: skillmap-backend
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r backend/requirements.txt python-multipart"
    startCommand: "cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: DATABASE_URL
        sync: false # Set to your Neon.tech connection string
